<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUENTA - Unofficial Website by Marco</title>
<link rel="stylesheet" href="css/estilocuenta.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="contenedor1">
            <a href="index.html">
                <img src="img/LOGOCUENTA.png" class="logo">
            </a>
        </div>
        <div class="contenedor2">
            <h2>Iniciar sesión</h2>
            <p>Inicia sesión o crea una cuenta</p>
            <div class="shop">
                <button type="submit" class="boton-shop">Continuar con shop</p>
            </div>
            <p>-------------------- O ---------------------</p>
            <form class="formulario">
                <input type="email" placeholder="Correo electrónico">
                <button type="submit">Continuar</button>
            </form>
            <label class="novedades">
                <input type="checkbox">
                <p>Enviarme novedades y ofertas por correo electrónico</p>
            </label>
        </div>
    </div>
</body>
